<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>

<title>{{subject}}</title>
<style>
  body{margin:0;padding:0;background:#000000;}
  a{color:#FFDC00;}

    .px{padding-left:22px!important;padding-right:22px!important;}
    .h1{font-size:28px!important;line-height:34px!important;}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#000000;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;font-size:1px;line-height:1px;">{{preheader}}&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;&#8199;&#847;</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#000000" style="background:#000000;">
<tr><td align="center" style="padding:0;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#000000;">
  <tr><td class="px" style="padding:28px 32px 24px 32px;"><a href="https://listengeet.com" style="text-decoration:none;"><img src="https://listengeet.com/email/email-logo.png" width="160" height="39" alt="Geet" style="display:block;border:0;width:160px;height:39px;color:#FFFFFF;font:800 24px/30px Outfit,'Avenir Next','Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;"></a></td></tr>
  <tr><td style="padding:0 32px;" class="px"><div style="border-top:1px solid #2A2A2A;font-size:0;line-height:0;">&nbsp;</div></td></tr>
  <tr><td style="padding:0;"><a href="{{cta_url}}"><img src="{{hero_image}}" width="600" height="262" alt="{{hero_alt}}" style="display:block;width:100%;max-width:600px;height:auto;border:0;"></a></td></tr>
  <tr><td class="px" style="padding:32px 32px 32px 32px;">
<div style="font:700 12px/16px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;letter-spacing:1.2px;text-transform:uppercase;color:#FFDC00;">{{kicker}}</div><div style="height:10px;line-height:10px;font-size:0;">&nbsp;</div><h1 class="h1" style="margin:0;font:800 34px/40px Outfit,'Avenir Next','Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;letter-spacing:-0.5px;color:#FFFFFF;">{{headline}}</h1><div style="height:14px;line-height:14px;font-size:0;">&nbsp;</div><p style="margin:0 0 16px 0;font:400 16px/24px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#B3B3B3;">{{body_html}}</p><div style="height:8px;line-height:8px;font-size:0;">&nbsp;</div><table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td bgcolor="#FFDC00" style="border-radius:999px;"><a href="{{cta_url}}" style="display:inline-block;padding:14px 28px;font:700 16px/20px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#000000;text-decoration:none;border-radius:999px;">{{cta_label}}</a></td></tr></table>
  </td></tr>
  <tr><td class="px" style="padding:8px 32px 40px 32px;">
    <div style="border-top:1px solid #2A2A2A;font-size:0;line-height:0;">&nbsp;</div>
    <div style="height:20px;line-height:20px;font-size:0;">&nbsp;</div>
    <p style="margin:0 0 10px 0;font:400 12px/18px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#8A8A8A;">You're receiving this because you chose to get Geet news at listengeet.com.</p>
    <p style="margin:0 0 10px 0;font:400 12px/18px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#8A8A8A;"><a href="{{unsubscribe_url}}" style="color:#B3B3B3;text-decoration:underline;">Unsubscribe</a> &nbsp;&middot;&nbsp; <a href="{{preferences_url}}" style="color:#B3B3B3;text-decoration:underline;">Email preferences</a></p>
    <p style="margin:0 0 10px 0;font:400 12px/18px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#8A8A8A;">Geet, {{postal_address}}</p>
    <p style="margin:0;"><span style="font:700 12px/18px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#B3B3B3;">Geet</span> <span style="font:400 12px/18px Inter,'Segoe UI',Helvetica,Arial,'Noto Sans Gurmukhi','Noto Sans Devanagari',sans-serif;color:#8A8A8A;">&middot; Music sounds <span style="color:#FFDC00;">better together</span>.</span></p>
  </td></tr>
</table>
</td></tr></table>
</body>
</html>
