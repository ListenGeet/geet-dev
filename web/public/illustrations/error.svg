<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Something went wrong</title>

  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFDC00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFDC00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="240" cy="150" rx="200" ry="130" fill="url(#glow)"/>

  <!-- Badge -->
  <circle cx="240" cy="150" r="70" fill="#181818" stroke="#2A2A2A" stroke-width="3"/>

  <!-- Equalizer bars: left side live, right side faded -->
  <g fill="#FFDC00">
    <rect x="196" y="140" width="10" height="20" rx="5"/>
    <rect x="212" y="126" width="10" height="48" rx="5"/>
  </g>
  <g fill="#FFDC00" opacity=".45">
    <rect x="258" y="126" width="10" height="48" rx="5"/>
    <rect x="274" y="140" width="10" height="20" rx="5"/>
  </g>

  <!-- Exclamation mark -->
  <g fill="#FF8A5C" stroke="#FF8A5C">
    <path d="M240 126v26" stroke-width="10" stroke-linecap="round"/>
    <circle cx="240" cy="169" r="5" stroke="none"/>
  </g>
</svg>
