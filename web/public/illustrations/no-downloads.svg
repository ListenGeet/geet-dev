<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">No songs saved on this device</title>

  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFDC00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFDC00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background glow -->
  <ellipse cx="240" cy="150" rx="200" ry="130" fill="url(#glow)"/>

  <!-- Shelf -->
  <rect x="150" y="224" width="180" height="14" rx="7" fill="#2A2A2A"/>

  <!-- Empty tray -->
  <path d="M174 184v28a8 8 0 0 0 8 8h116a8 8 0 0 0 8-8v-28"
        fill="none" stroke="#FFE94D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Download arrow -->
  <g fill="none" stroke="#FFDC00" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 62v92"/>
    <path d="M202 118l38 40 38-40"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="90"  r="4"   fill="#FFF0A0" opacity=".7"/>
  <circle cx="372" cy="120" r="3"   fill="#FFE94D" opacity=".7"/>
  <circle cx="340" cy="60"  r="2.5" fill="#B3B3B3"/>
</svg>
