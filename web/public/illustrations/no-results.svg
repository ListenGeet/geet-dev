  <!-- Magnifier lens -->
  <circle cx="224" cy="140" r="62" fill="#181818" stroke="#FFDC00" stroke-width="12"/>

  <!-- Quiet equalizer inside the lens -->
  <g fill="#B3B3B3">
    <rect x="204" y="130" width="8" height="20" rx="4"/>
    <rect x="220" y="120" width="8" height="40" rx="4"/>
    <rect x="236" y="130" width="8" height="20" rx="4"/>
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="80"  r="4" fill="#FFF0A0" opacity=".7"/>
  <circle cx="380" cy="110" r="3" fill="#FFE94D" opacity=".7"/>
</svg>
