<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">No connection</title>

  <defs>
    <radialGradient id="glow" cx=".5" cy=".42" r=".55">
      <stop offset="0" stop-color="#FFDC00" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFDC00" stop-opacity="0"/>
    </radialGradient>

    <!-- Cuts a clean gap around the slash so it reads over the cloud -->
    <mask id="slash-gap" maskUnits="userSpaceOnUse" x="0" y="0" width="480" height="320">
      <rect width="480" height="320" fill="#fff"/>
      <path d="M150 232L330 92" stroke="#000" stroke-width="20" stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- Background glow -->
  <ellipse cx="240" cy="150" rx="200" ry="130" fill="url(#glow)"/>

  <g mask="url(#slash-gap)">
    <!-- Cloud -->
    <path d="M168 214a46 46 0 0 1 6-91 68 68 0 0 1 130 14 38 38 0 0 1-6 77z"
          fill="#242424" stroke="#3B2F4A" stroke-width="3"/>

    <!-- Equalizer bars -->
    <g fill="#FFDC00" opacity=".9">
      <rect x="206" y="152" width="10" height="26" rx="5"/>
      <rect x="224" y="138" width="10" height="54" rx="5"/>
      <rect x="242" y="146" width="10" height="38" rx="5"/>
      <rect x="260" y="158" width="10" height="14" rx="5"/>
    </g>
  </g>

  <!-- Slash -->
  <path d="M150 232L330 92" stroke="#FF8A5C" stroke-width="10" stroke-linecap="round"/>
</svg>
